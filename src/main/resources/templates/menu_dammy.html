<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>メニュー</title>
  
</head>
<body>
    <!-- ログイン情報表示 -->
    <div class="login-info" th:if="${session.loginName != null}">
        ログイン名: <span th:text="${session.loginName}"></span><br>
        ログイン時刻: <span th:text="${session.loginTime}"></span>
    </div>

    <h1>メニュー画面</h1>
    <p>こちらはメニュー画面です。</p>

    <div class="menu-buttons">
        <!-- 社員検索 -->
        <form th:action="@{/employees}" method="get">
            <button type="submit">社員検索に戻る</button>
        </form>

        <!-- 登録画面 -->
        <form th:action="@{/employees/insert}" method="get">
            <button type="submit">登録画面へ</button>
        </form>

        <!-- 更新画面 -->
        <form th:action="@{/employees/update}" method="get">
            <button type="submit">更新画面へ</button>
        </form>

        <!-- 削除画面 -->
        <form th:action="@{/employees/delete}" method="get">
            <button type="submit">削除画面へ</button>
        </form>

        <!-- ログイン画面 -->
		
        <form th:action="@{/login}" method="get">
            <button type="submit">ログイン画面へ</button>
        </form>
    </div>
</body>
</html>
