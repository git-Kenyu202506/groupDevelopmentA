<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">

	<title>社員検索</title>
	<link rel="stylesheet" th:href="@{/search.css}">



	<script>
		function isNumeric(value) {
			return /^\d*$/.test(value); // 0-9 の数字のみ
		}
		function isValidDateFormat(value) {
			return /^\d{8}$/.test(value); // 8桁の数字かどうか
		}
		function checkRange(form) {
			// 社員IDチェック
			let employeeId = form.employeeId.value;
			if (employeeId && !isNumeric(employeeId)) {
				alert("社員IDは数字のみで入力してください");
				form.employeeId.focus();
				return false;
			}

			// 年齢チェック
			let ageFrom = form.ageFrom.value;
			let ageTo = form.ageTo.value;
			if ((ageFrom && !isNumeric(ageFrom)) || (ageTo && !isNumeric(ageTo))) {
				alert("年齢は数字のみで入力してください");
				if (!isNumeric(ageFrom)) form.ageFrom.focus();
				else form.ageTo.focus();
				return false;
			}

			// 年齢範囲チェック
			if (ageFrom && ageTo && parseInt(ageFrom) > parseInt(ageTo)) {
				alert("年齢範囲が不正です");
				return false;
			}

			let startFrom = form.startDateFrom.value;
			let startTo = form.startDateTo.value;
			if (startFrom && !isValidDateFormat(startFrom)) {
				alert("入社日の開始日付は yyyyMMdd 形式で入力してください");
				return false;
			}
			if (startTo && !isValidDateFormat(startTo)) {
				alert("入社日の終了日付は yyyyMMdd 形式で入力してください");
				return false;
			}
			if (startFrom && startTo && startFrom > startTo) {
				alert("入社日範囲が不正です");
				return false;
			}

			let endFrom = form.endDateFrom.value;
			let endTo = form.endDateTo.value;
			if (endFrom && !isValidDateFormat(endFrom)) {
				alert("退職日の開始日付は yyyyMMdd 形式で入力してください");
				return false;
			}
			if (endTo && !isValidDateFormat(endTo)) {
				alert("退職日の終了日付は yyyyMMdd 形式で入力してください");
				return false;
			}
			if (endFrom && endTo && endFrom > endTo) {
				alert("退職日範囲が不正です");
				return false;
			}

			return true;
		}


		window.onload = function () {
			// 入力値を保存
			document.querySelectorAll(".search-form input").forEach(el => {
				if (sessionStorage.getItem(el.name)) {
					el.value = sessionStorage.getItem(el.name);
				}
				el.addEventListener("input", () => {
					sessionStorage.setItem(el.name, el.value);
				});
			});

			// リセットボタン押下時は入力値も消す
			document.querySelector(".search-form").addEventListener("reset", () => {
				document.querySelectorAll(".search-form input").forEach(el => {
					sessionStorage.removeItem(el.name);
				});
			});
		};

		// ✅ 検索画面以外に移動するなら 入力値 をクリア
		document.addEventListener("click", (e) => {
			const target = e.target.closest("a, button[type='submit'], input[type='submit']");
			if (target) {
				let href = target.getAttribute("href") || target.form?.action || "";
				if (href && !href.includes("/employees/search")) {
					sessionStorage.clear();
				}
			}
		});
	</script>
</head>

<body>
	<div class="header">
		<h1>社員情報検索</h1>
		<div class="login-info">
			<span th:text="'ログイン名: ' + ${session.loginName}"></span><br>
			<span th:text="'ログイン時刻: ' + ${session.loginTime}"></span>
		</div>
	</div>
	<div class="btn-box">
		<form th:action="@{/employees/menu}" method="get" style="display:inline">
			<button type="submit">メニュー</button>
		</form>
		<form th:action="@{/employees/insert}" method="get" style="display:inline">
			<button type="submit" class="insert-btn">登録画面</button>
		</form>
	</div>
	<form th:action="@{/employees/search}" method="post" onsubmit="return checkRange(this)" class="search-form">
		<!-- フォーム入力部分 -->

		<div class="form-inputs">
			<div class="form-col">
				<label>社員ID: <input type="text" name="employeeId"></label><br>
				<label>社員名: <input type="text" name="employeeName"></label>
			</div>

			<div class="form-col">
				<label>年齢　 : <input type="text" name="ageFrom"> ～ <input type="text" name="ageTo"></label><br>
				<label>入社日 : <input type="text" name="startDateFrom" placeholder="yyyyMMdd"> ～ <input type="text"
						name="startDateTo" placeholder="yyyyMMdd"></label><br>
				<label>退職日 : <input type="text" name="endDateFrom" placeholder="yyyyMMdd"> ～ <input type="text"
						name="endDateTo" placeholder="yyyyMMdd"></label>
			</div>
		</div>



		<div class="form-buttons">
			<button type="submit" class="orange-btn">検索</button><br>
			<input type="reset" value="クリア" class="reset-btn">
		</div>
	</form>


	<div th:if="${employees != null}" class="table-box">
		<p><span th:text="${count}"></span>件</p>
		<form th:action="@{/employees/delete}" method="post" id="employeeForm">
			<div class="table-wrapper">
				<table th:if="${count > 0}" class="employee-table">
					<tr>
						<th>✅</th>
						<th>ID</th>
						<th>名前</th>
						<th>年齢</th>
						<th>入社日</th>
						<th>退職日</th>
					</tr>
					<tr th:each="emp : ${employees}">
						<td><input type="checkbox" name="employeeIds" th:value="${emp.employeeId}"></td>
						<td>
							<a th:href="@{'/employees/update/' + ${emp.employeeId}}" th:text="${emp.employeeId}"></a>
						</td>
						<td th:text="${emp.employeeName}"></td>
						<td th:text="${emp.age}"></td>
						<td th:text="${emp.startDate}"></td>
						<td th:text="${emp.endDate}"></td>
					</tr>
				</table>

				<!-- 削除ボタン-->
				<div th:if="${count > 0}" class="delete-btn-wrapper">
					<button type="submit" class="btn delete-btn">削除</button>
				</div>


			</div>
		</form>

		<!-- 該当なし-->

		<p style="color:red" th:if="${count == 0}">該当者なし</p>
	</div>

	<footer>
		<p>groupDevelopmentA &copy; 2025 </p>
	</footer>

</body>

</html>
