	<script>
		// 数字チェック
		function isNumeric(value) {
			return /^\d*$/.test(value);
		}

		// 日付チェック（input type="date" 用）
		function checkValidDate(input) {
			const val = input.value.trim();
			if (!val) return true; // 空ならOK

			// yyyy-mm-dd形式だけを厳密チェック
			const match = /^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.exec(val);
			if (!match) return false;

			const year = parseInt(match[1], 10);
			const month = parseInt(match[2], 10);
			const day = parseInt(match[3], 10);

			// 実在する日付か確認
			const date = new Date(year, month - 1, day);
			if (date.getFullYear() !== year || date.getMonth() + 1 !== month || date.getDate() !== day) {
				return false;
			}

			return true;
		}


		// 日付チェック（input type="text" yyyy/mm/dd 用）
		function checkValidDateYMD(input) {
			const val = input.value.trim();
			if (!val) return true; // 空ならOK

			// yyyy/mm/dd の形式チェック
			const match = /^(\d{4})\/(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])$/.exec(val);
			if (!match) return false;

			const year = parseInt(match[1], 10);
			const month = parseInt(match[2], 10);
			const day = parseInt(match[3], 10);

			const date = new Date(year, month - 1, day);
			return (
				date.getFullYear() === year &&
				date.getMonth() + 1 === month &&
				date.getDate() === day
			);
		}

		// フォーム送信前の範囲チェック
		function checkRange(form) {
			// 社員ID
			const employeeId = form.employeeId.value.trim();
			if (employeeId && !isNumeric(employeeId)) {
				alert("社員IDは数字のみで入力してください");
				form.employeeId.focus();
				return false;
			}

			// 年齢
			const ageFrom = form.ageFrom.value.trim();
			const ageTo = form.ageTo.value.trim();
			if ((ageFrom && !isNumeric(ageFrom)) || (ageTo && !isNumeric(ageTo))) {
				alert("年齢は数字のみで入力してください");
				if (!isNumeric(ageFrom)) form.ageFrom.focus();
				else form.ageTo.focus();
				return false;
			}
			if (ageFrom && ageTo && parseInt(ageFrom) > parseInt(ageTo)) {
				alert("年齢範囲が不正です");
				form.ageFrom.focus();
				return false;
			}

			// 入社日（date型）
			const startFrom = form.startDateFrom;
			const startTo = form.startDateTo;
			if (!checkValidDate(startFrom)) {
				alert("入社日の形式が不正です。存在する yyyy-mm-dd を入力してください。");
				startFrom.focus();
				return false;
			}
			if (!checkValidDate(startTo)) {
				alert("入社日の形式が不正です。存在する yyyy-mm-dd を入力してください。");
				startTo.focus();
				return false;
			}
			if (startFrom.value && startTo.value) {

					return false;
				}
			}

			// 退社日

				endTo.focus();
				return false;
			}
			if (endFrom.value && endTo.value) {

		//読み込み字時の処理
		window.onload = function () {
			const form = document.querySelector(".search-form");
			const deleteBtn = document.getElementById("deleteBtn");

			// 入力値保持
			document.querySelectorAll(".search-form input").forEach(el => {
				if (sessionStorage.getItem(el.name)) {
					el.value = sessionStorage.getItem(el.name);
				}

				if (el.type !== "reset") {
					el.addEventListener("input", () => {
						sessionStorage.setItem(el.name, el.value);
						toggleDeleteBtn();
					});
				}
			});

			// リセット時に sessionStorage クリア
			form.addEventListener("reset", () => {
				document.querySelectorAll(".search-form input").forEach(el => {
					if (el.type !== "reset") {
						sessionStorage.removeItem(el.name);
						setTimeout(() => {el.value = "";}, 0);
					}
				});
				toggleDeleteBtn();
			});

			// 削除ボタン制御
			document.addEventListener("change", (e) => {
				if (e.target.name === 'employeeIds') toggleDeleteBtn();
			});

			function toggleDeleteBtn() {
				const checkboxes = document.querySelectorAll("input[name='employeeIds']");
				const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
				if (deleteBtn) deleteBtn.style.display = anyChecked ? "inline-block" : "none";
			}

			toggleDeleteBtn();
		};

		// 他ページ遷移時に sessionStorage をクリア
		document.addEventListener("click", (e) => {
			const target = e.target.closest("a, button[type='submit'], input[type='submit']");
			if (target) {
				let href = target.getAttribute("href") || target.form?.action || "";
				if (href && !href.includes("/employees/search")) {
					sessionStorage.clear();
				}
			}
		});

	<div class="header">
		<h1>社員情報検索</h1>
		<div class="login-info">
			<span th:text="'ログイン名: ' + ${session.loginName}"></span><br>

		</div>
	</div>

	<div class="btn-box">
		<form th:action="@{/employees/menu}" method="get" style="display:inline">

		</form>
		<form th:action="@{/employees/insert}" method="get" style="display:inline">
			<button type="submit" class="insert-btn">登録画面</button>
		</form>
	</div>

	<form th:action="@{/employees/search}" method="post" onsubmit="return checkRange(this)" class="search-form">
		<div class="form-inputs">
			<div class="form-col">
				<label>社員ID: <input type="text" name="employeeId" th:value="${employeeId}"></label><br>

			</div>
			<div class="form-col">
				<label>年齢 　: <input type="text" name="ageFrom" th:value="${ageFrom}"> ～ <input type="text" name="ageTo"

<!--				labelがdataの場合-->
				<label>入社日 :
					<input type="date" name="startDateFrom" min="1900-01-01" max="2100-12-31">
					～
					<input type="date" name="startDateTo" min="1900-01-01" max="2100-12-31">
				</label>

				<label>退社日 :
					<input type="date" name="endDateFrom" min="1900-01-01" max="2100-12-31">
					～
					<input type="date" name="endDateTo" min="1900-01-01" max="2100-12-31">
				</label>


				<!--										labelがtextの場合-->
				<!--				<label>入社日 :-->
				<!--					<input type="text" name="startDateFrom" placeholder="yyyy/mm/dd">-->
				<!--					～-->
				<!--					<input type="text" name="startDateTo" placeholder="yyyy/mm/dd">-->
				<!--				</label>-->

				<!--				<label>退社日 :-->
				<!--					<input type="text" name="endDateFrom" placeholder="yyyy/mm/dd">-->
				<!--					～-->
				<!--					<input type="text" name="endDateTo" placeholder="yyyy/mm/dd">-->
				<!--				</label>-->



			</div>
		</div>

		<div class="form-buttons">
			<button type="submit" class="orange-btn">検索</button><br>
			<input type="reset" value="クリア" class="reset-btn">
		</div>
	</form>
	<div th:if="${employees != null}" class="table-box">
		<p><span th:text="${count}"></span>件</p>
		<p style="color:red" th:if="${count == 0}">該当者なし</p>

		<form th:action="@{/employees/delete}" method="post" id="employeeForm">
			<div class="table-wrapper">
				<table th:if="${count > 0}" class="employee-table">
					<tr>
						<th>✅</th>
						<th>ID</th>
						<th>名前</th>
						<th>年齢</th>
						<th>入社日</th>
						<th>退職日</th>
					</tr>
					<tr th:each="emp : ${employees}">
						<td><input type="checkbox" name="employeeIds" th:value="${emp.employeeId}"></td>
						<td>
							<a th:href="@{'/employees/update/' + ${emp.employeeId}}" th:text="${emp.employeeId}"></a>
						</td>
						<td th:text="${emp.employeeName}"></td>
						<td th:text="${emp.age}"></td>
						<td th:text="${emp.startDate != null ? #temporals.format(emp.startDate, 'yyyy/MM/dd') : ''}">
						</td>
						<td th:text="${emp.endDate != null ? #temporals.format(emp.endDate, 'yyyy/MM/dd') : ''}"></td>
					</tr>
				</table>


				<button type="submit" id="deleteBtn">削除</button>
			</div>
		</form>
	</div>
	<footer>
		<div class="footer">

	</footer>
